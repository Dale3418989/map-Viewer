<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>轉曲圖分場景檢視</title>
<style>
:root{--ink:#1d2321;--mute:#6b7470;--line:#d6dbd8;--acc:#c0392b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font:14px/1.4 "Microsoft JhengHei","PingFang TC","Noto Sans CJK TC",sans-serif;color:var(--ink);background:#fff}
#map{position:fixed;inset:0;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}
#panel{position:fixed;top:10px;left:10px;width:310px;max-width:calc(100vw - 20px);background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:10px}
#panel h1{font-size:13px;margin:0 0 8px;color:var(--mute);font-weight:600;display:flex;justify-content:space-between;align-items:center}
#panel h1 button{border:0;background:none;color:var(--mute);cursor:pointer;font-size:13px}
#panel.min .body{display:none}
.row{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
select,input,button.b{font:inherit;border:1px solid var(--line);border-radius:5px;padding:5px 7px;background:#fff;color:var(--ink)}
select{flex:1;min-width:0;font-weight:600}
input#q{flex:1;min-width:0}
button.b{cursor:pointer;background:var(--ink);color:#fff;border-color:var(--ink)}
label.t{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:4px;margin-right:8px;user-select:none}
#res{max-height:160px;overflow:auto;margin:4px 0 0;padding:0;list-style:none;font-size:13px}
#res li{padding:4px 6px;border-radius:4px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
#res li:hover,#res li.on{background:#eef3f8}
#res li small{color:var(--mute);white-space:nowrap}
#msg{font-size:12px;color:var(--mute);margin-top:4px;min-height:16px;word-break:break-all}
#msg b{color:var(--ink)}
#msg .warn{color:var(--acc)}
#msg a{color:#0b6bcb;cursor:pointer;text-decoration:underline;margin-right:6px}
#hud{position:fixed;left:10px;bottom:10px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:5px;padding:3px 8px;font:12px/1.4 Consolas,monospace;color:var(--mute)}
#mini{position:fixed;right:10px;bottom:10px;border:1px solid var(--line);border-radius:5px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:crosshair}
#help{font-size:11px;color:var(--mute);margin-top:6px;line-height:1.5}
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="panel">
  <h1><span id="ttl">載入中...</span><button id="tog" title="收合">－</button></h1>
  <div class="body">
    <div class="row">
      <select id="scene">
        <option value="*">全部場景（全圖上查）</option>
      </select>
    </div>
    <div class="row" id="views">
      <label class="t"><input type="radio" name="view" value="scene" checked>場景圖</label>
      <label class="t"><input type="radio" name="view" value="all">全圖（所有節目疊在一起）</label>
    </div>
    <div class="row">
      <input id="q" placeholder="編號（01-01、1-01、1-1 皆可）或座標 x,y" autocomplete="off">
      <button class="b" id="go">定位</button>
    </div>
    <div class="row" id="sides">
      <label class="t"><input type="radio" name="side" value="" checked>全</label>
      <label class="t"><input type="radio" name="side" value="東">東</label>
      <label class="t"><input type="radio" name="side" value="西">西</label>
    </div>
    <div class="row">
      <label class="t"><input type="checkbox" id="showBase" checked>底圖</label>
      <label class="t"><input type="checkbox" id="showGhost" checked>疊母層</label>
      <label class="t"><input type="checkbox" id="showPts">標出本場景</label>
      <label class="t"><input type="checkbox" id="showFlags" checked>異常</label>
    </div>
    <ul id="res"></ul>
    <div id="msg">請點擊地圖或搜尋位置</div>
    <div id="help">拖曳平移・滾輪/雙指縮放・點圖查最近編號・「/」聚焦搜尋・[ ] 切場景・網址可分享定位</div>
  </div>
</div>
<div id="hud">載入中...</div>
<canvas id="mini" width="240" height="192"></canvas>

<!-- 修正後的正確引號路徑 -->
<script src="data.js"></script>
<script src="index.js"></script>

<script>
"use strict";
const M = window.TILE_META, IX = window.TILE_INDEX || {scenes: [], pts: {}, flags: []};
const $ = s => document.querySelector(s);
const cv = $("#map"), g = cv.getContext("2d"), mini = $("#mini"), mg = mini.getContext("2d");
const T = M.tile, ZMAX = M.zmax;
const scaleOf = z => M.maxScale / Math.pow(2, ZMAX - z);
const PRESENT = {};
for (const L in M.present) PRESENT[L] = M.present[L].map(s => Uint8Array.from(atob(s), c => c.charCodeAt(0)));
function has(L, z, x, y) {
  const b = PRESENT[L]; if (!b) return false;
  const [nx, ny] = M.levels[z]; if (x < 0 || y < 0 || x >= nx || y >= ny) return false;
  const k = x * ny + y; return (b[z][k >> 3] >> (k & 7)) & 1;
}

function normId(s) {
  s = String(s || "").trim().replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
       .replace(/[－—–]/g, "-").replace(/\s+/g, "");
  return s.replace(/\d+/g, d => String(parseInt(d, 10)));
}
const curSide = () => (document.querySelector("input[name=side]:checked") || {}).value || "";
function setSide(v) { document.querySelectorAll("input[name=side]").forEach(r => r.checked = r.value === (v || "")); }
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }

// ---- 視圖(pt 座標, k = CSS px/pt)
let W = 0, H = 0, dpr = 1, cx = M.x0 + M.W / 2, cy = M.y0 + M.H / 2, k = 1;
let marker = null, pick = null, anim = null, dirty = true, hover = null;
const kFit = () => Math.min(W / M.W, H / M.H) * 0.95, kMax = () => M.maxScale * 3;
function clampView() {
  k = Math.max(kFit() * 0.5, Math.min(kMax(), k));
  cx = Math.max(M.x0, Math.min(M.x0 + M.W, cx)); cy = Math.max(M.y0, Math.min(M.y0 + M.H, cy));
}
function resize() {
  dpr = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + "px"; cv.style.height = H + "px";
  const mw = Math.min(220, W * 0.35), mh = mw * M.H / M.W;
  mini.width = mw * dpr; mini.height = mh * dpr; mini.style.width = mw + "px"; mini.style.height = mh + "px";
  clampView(); dirty = true;
}
const toScr = (x, y) => [(x - cx) * k + W / 2, (y - cy) * k + H / 2];
const toPt = (sx, sy) => [(sx - W / 2) / k + cx, (sy - H / 2) / k + cy];

// ---- 瓦片快取
const cache = new Map(), CACHE_MAX = 900;
const packs = new Map(), PACK_MAX = 300;
function packOf(L, z, x, y) {
  const P = M.pack, key = L + "/" + z + "/" + Math.floor(x / P) + "_" + Math.floor(y / P);
  let p = packs.get(key);
  if (p) { packs.delete(key); packs.set(key, p); return p; }
  p = fetch("packs/" + encodeURIComponent(L) + "/" + z + "/" + Math.floor(x / P) + "_" + Math.floor(y / P) + ".bin")
    .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(buf => {
      const dv = new DataView(buf), n = dv.getUint16(4, true), idx = new Map();
      for (let i = 0; i < n; i++) { 
        const o = 6 + 10 * i; 
        idx.set(dv.getUint8(o) + "," + dv.getUint8(o + 1), [dv.getUint32(o + 2, true), dv.getUint32(o + 6, true)]); 
      }
      return {buf, idx};
    });
  packs.set(key, p);
  while (packs.size > PACK_MAX) packs.delete(packs.keys().next().value);
  return p;
}
function loadPacked(e, L, z, x, y) {
  const P = M.pack;
  packOf(L, z, x, y).then(pk => {
    const ent = pk.idx.get((x % P) + "," + (y % P));
    if (!ent) { e.blank = true; dirty = true; return; }
    return createImageBitmap(new Blob([new Uint8Array(pk.buf, ent[0], ent[1])], {type: "image/" + M.fmt}))
      .then(bm => { e.img = bm; e.ok = true; dirty = true; });
  }).catch(() => { e.blank = true; dirty = true; });
}
function tile(L, z, x, y, want) {
  if (!has(L, z, x, y)) return {blank: true};
  const key = L + "/" + z + "/" + x + "/" + y;
  let e = cache.get(key);
  if (e) { cache.delete(key); cache.set(key, e); return e; }
  if (!want) return null;
  if (M.pack) { 
    e = {img: null, ok: false}; 
    loadPacked(e, L, z, x, y); 
  } else {
    e = {img: new Image(), ok: false};
    e.img.onload = () => { e.ok = true; dirty = true; };
    e.img.onerror = () => { e.blank = true; dirty = true; };
    e.img.src = "tiles/" + encodeURIComponent(L) + "/" + z + "/" + x + "/" + y + "." + M.fmt;
  }
  cache.set(key, e);
  while (cache.size > CACHE_MAX) cache.delete(cache.keys().next().value);
  return e;
}
function levelFor(kk) { const need = kk * dpr; for (let z = 0; z <= ZMAX; z++) if (scaleOf(z) >= need) return z; return ZMAX; }

function drawLayer(L, z, alpha) {
  const sc = scaleOf(z), tpt = T / sc;
  const [a0, b0] = toPt(0, 0), [a1, b1] = toPt(W, H);
  const x0 = Math.max(0, Math.floor((a0 - M.x0) / tpt)), x1 = Math.min(M.levels[z][0] - 1, Math.floor((a1 - M.x0) / tpt));
  const y0 = Math.max(0, Math.floor((b0 - M.y0) / tpt)), y1 = Math.min(M.levels[z][1] - 1, Math.floor((b1 - M.y0) / tpt));
  g.globalAlpha = alpha;
  for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) {
    const e = tile(L, z, x, y, true);
    if (!e || e.blank) continue;
    const [sx, sy] = toScr(M.x0 + x * tpt, M.y0 + y * tpt), sw = tpt * k;
    if (e.ok) { g.drawImage(e.img, sx, sy, sw + 0.5, sw + 0.5); continue; }
    for (let d = 1; d <= z; d++) {
      const p = tile(L, z - d, x >> d, y >> d, d === 1);
      if (p && p.blank) break;
      if (p && p.ok) {
        const n = 1 << d, s = T / n;
        g.drawImage(p.img, (x & (n - 1)) * s, (y & (n - 1)) * s, s, s, sx, sy, sw + 0.5, sw + 0.5);
        break;
      }
    }
  }
  g.globalAlpha = 1;
}
const curView = () => (scene === "*" ? "all" : (document.querySelector("input[name=view]:checked") || {}).value || "scene");
function setView(v) { document.querySelectorAll("input[name=view]").forEach(r => r.checked = r.value === v); }
function stack() {
  if (curView() === "all") return PRESENT[M.all] ? [[M.all, 1]] : (PRESENT[M.base] ? [[M.base, 1]] : []);
  const out = [];
  if ($("#showBase").checked && PRESENT[M.base]) out.push([M.base, 1]);
  if ($("#showGhost").checked && SC[scene]) SC[scene].fallback.forEach(f => out.push([f, M.ghost]));
  if (scene) out.push([scene, 1]);
  return out;
}

// ---- 場景/索引
const SC = {}; IX.scenes.forEach(s => SC[s.code] = s);
const CODES = IX.scenes.map(s => s.code);
let scene = CODES[0] || "";
const ptsOf = c => (IX.pts && IX.pts[c]) || [];
const sceneName = c => { if (c === "*") return "全部場景"; const s = SC[c]; return s ? s.code + (s.label ? " " + s.label : "") : c; };
const inScope = c => scene === "*" || c === scene;

function parseQ(text) {
  text = String(text || "").trim();
  const mxy = text.match(/^@?\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)$/);
  if (mxy) return {xy: [parseFloat(mxy[1]), parseFloat(mxy[2])]};
  return {id: normId(text.replace(/[東西]/g, "")), side: curSide()};
}
function find(code, id, side, via) {
  const hits = [];
  for (const p of ptsOf(code)) if (p[0] === id && (!side || !p[1] || p[1] === side))
    hits.push({code, via, id: p[0], disp: p[5] || p[0], side: p[1], x: p[2], y: p[3], note: p[4] || ""});
  return hits;
}

function flyTo(x, y, kk, ms) {
  kk = kk || Math.max(k, M.maxScale * 0.9);
  const s = {cx, cy, lk: Math.log(k)}, e = {cx: x, cy: y, lk: Math.log(Math.min(kMax(), kk))};
  const t0 = performance.now(); ms = ms == null ? 450 : ms;
  anim = t => {
    let u = ms ? Math.min(1, (t - t0) / ms) : 1; u = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    cx = s.cx + (e.cx - s.cx) * u; cy = s.cy + (e.cy - s.cy) * u; k = Math.exp(s.lk + (e.lk - s.lk) * u);
    if (u >= 1) anim = null;
    dirty = true;
  };
}
let lastHash = "";
function setHash(o) {
  const q = Object.entries(o).filter(([, v]) => v !== "" && v != null).map(([a, b]) => a + "=" + encodeURIComponent(b)).join("&");
  lastHash = q;
  try { history.replaceState(null, "", "#" + q); } catch (e) { location.replace("#" + q); }
}
function locateHit(h) {
  marker = {x: h.x, y: h.y, t: performance.now()};
  flyTo(h.x, h.y);
  $("#msg").innerHTML = "<b>" + escapeHtml(sceneName(scene === "*" ? h.code : scene)) + "・" + escapeHtml(h.disp) + " " + (h.side || "") + "</b> (" + h.x.toFixed(1) + ", " + h.y.toFixed(1) + ")"
    + (h.via ? " <span class='warn'>本場景無此點, 沿用 " + h.via + " 位置</span>" : "")
    + (h.note ? "<br>" + escapeHtml(h.note) : "");
  setHash({s: scene, v: curView(), id: h.disp, side: h.side});
}
function setScene(c, keepQuery) {
  if (!SC[c] && c !== "*") return;
  scene = c; $("#scene").value = c; dirty = true; $("#res").innerHTML = "";
  $("#views").style.display = c === "*" || !PRESENT[M.all] ? "none" : "";
  if (keepQuery && $("#q").value.trim()) doSearch(); else setHash({s: scene, v: curView()});
}

function doSearch() {
  const r = parseQ($("#q").value), ul = $("#res"); ul.innerHTML = "";
  if (r.xy) {
    const [x, y] = r.xy;
    marker = {x, y, t: performance.now()}; flyTo(x, y);
    $("#msg").innerHTML = "座標 (" + x + ", " + y + ")" + (x < M.x0 || y < M.y0 || x > M.x0 + M.W || y > M.y0 + M.H ? " <span class='warn'>在頁面外</span>" : "");
    setHash({s: scene, v: curView(), x, y}); return;
  }
  if (!r.id) return;
  let hits = scene === "*" ? [].concat(...CODES.map(c => find(c, r.id, r.side, ""))) : find(scene, r.id, r.side, "");
  if (!hits.length && SC[scene]) for (const f of SC[scene].fallback) hits = hits.concat(find(f, r.id, r.side, f));
  if (!hits.length) {
    const other = CODES.filter(c => c !== scene && find(c, r.id, r.side, "").length);
    $("#msg").innerHTML = "<span class='warn'>" + escapeHtml(sceneName(scene)) + " 找不到 " + escapeHtml(r.id) + (r.side ? "（" + r.side + "）" : "") + "</span>"
      + (!ptsOf(scene).length ? "（此場景沒有索引資料）" : "")
      + (other.length ? "<br>其他場景有：" + other.map(c => "<a data-s='" + c + "'>" + escapeHtml(sceneName(c)) + "</a>").join("") : "");
    $("#msg").querySelectorAll("a[data-s]").forEach(a => a.onclick = () => setScene(a.dataset.s, true));
    return;
  }
  if (hits.length === 1) { locateHit(hits[0]); return; }
  hits.forEach(h => {
    const li = document.createElement("li");
    li.innerHTML = "<span>" + (scene === "*" ? "<b>" + escapeHtml(sceneName(h.code)) + "</b> " : "") + escapeHtml(h.disp) + " " + (h.side || "") + (h.via ? "（" + h.via + "）" : "") + "</span><small>" + h.x.toFixed(0) + ", " + h.y.toFixed(0) + "</small>";
    li.onclick = () => { [...ul.children].forEach(c => c.classList.remove("on")); li.classList.add("on"); locateHit(h); };
    ul.appendChild(li);
  });
  $("#msg").textContent = "找到 " + hits.length + " 筆, 點選定位";
  ul.firstChild.click();
}

function nearest(x, y, rad) {
  let best = null, bd = rad * rad;
  const scan = (c, via) => { for (const p of ptsOf(c)) {
    const d = (p[2] - x) ** 2 + (p[3] - y) ** 2;
    if (d < bd) { bd = d; best = {code: c, via, id: p[0], disp: p[5] || p[0], side: p[1], x: p[2], y: p[3], note: p[4] || ""}; }
  } };
  if (scene === "*") CODES.forEach(c => scan(c, "")); else scan(scene, "");
  if ($("#showGhost").checked && SC[scene] && !best) SC[scene].fallback.forEach(f => scan(f, f));
  return best;
}
function nearestFlag(x, y, rad) {
  let best = null, bd = rad * rad;
  for (const f of IX.flags || []) {
    if (f[0] && !inScope(f[0])) continue;
    const d = (f[3] - x) ** 2 + (f[4] - y) ** 2;
    if (d < bd) { bd = d; best = f; }
  }
  return best;
}

function drawOverlay() {
  const [a0, b0] = toPt(0, 0), [a1, b1] = toPt(W, H), pad = 10 / k;
  const vis = (x, y) => x > a0 - pad && x < a1 + pad && y > b0 - pad && y < b1 + pad;
  if ($("#showPts").checked && scene) {
    const r = Math.max(2, 3.6 * k);
    g.strokeStyle = "rgba(11,107,203,.85)"; g.lineWidth = Math.max(1, Math.min(2.5, k * 0.3));
    g.beginPath();
    for (const p of (scene === "*" ? [].concat(...CODES.map(ptsOf)) : ptsOf(scene))) if (vis(p[2], p[3])) { const [sx, sy] = toScr(p[2], p[3]); g.moveTo(sx + r, sy); g.arc(sx, sy, r, 0, 7); }
    g.stroke();
  }
  if ($("#showFlags").checked && IX.flags && IX.flags.length) {
    const r = Math.max(4, 4.5 * k);
    g.fillStyle = "rgba(192,57,43,.22)"; g.strokeStyle = "rgba(192,57,43,.95)"; g.lineWidth = 1.5;
    for (const f of IX.flags) {
      if ((f[0] && !inScope(f[0])) || !vis(f[3], f[4])) continue;
      const [sx, sy] = toScr(f[3], f[4]);
      g.beginPath(); g.moveTo(sx, sy - r); g.lineTo(sx + r * .87, sy + r * .5); g.lineTo(sx - r * .87, sy + r * .5); g.closePath(); g.fill(); g.stroke();
    }
  }
  if (pick) {
    const [sx, sy] = toScr(pick.x, pick.y);
    g.strokeStyle = "#111"; g.lineWidth = 1; g.beginPath(); g.moveTo(sx - 7, sy); g.lineTo(sx + 7, sy); g.moveTo(sx, sy - 7); g.lineTo(sx, sy + 7); g.stroke();
  }
  if (marker) {
    const [sx, sy] = toScr(marker.x, marker.y), age = (performance.now() - marker.t) / 1000, r0 = Math.max(10, 4.5 * k);
    g.strokeStyle = "#e60000"; g.lineWidth = 3; g.beginPath(); g.arc(sx, sy, r0, 0, 7); g.stroke();
    if (age < 2.4) { const u = (age % .8) / .8; g.globalAlpha = 1 - u; g.beginPath(); g.arc(sx, sy, r0 * (1 + 2.5 * u), 0, 7); g.stroke(); g.globalAlpha = 1; dirty = true; }
    g.lineWidth = 1; g.setLineDash([4, 4]); g.strokeStyle = "rgba(230,0,0,.55)";
    g.beginPath(); g.moveTo(0, sy); g.lineTo(sx - r0, sy); g.moveTo(sx + r0, sy); g.lineTo(W, sy);
    g.moveTo(sx, 0); g.lineTo(sx, sy - r0); g.moveTo(sx, sy + r0); g.lineTo(sx, H); g.stroke(); g.setLineDash([]);
  }
}
function drawMini() {
  const mw = mini.width / dpr, mh = mini.height / dpr, s = mw / M.W;
  mg.setTransform(dpr, 0, 0, dpr, 0, 0); mg.fillStyle = "#fff"; mg.fillRect(0, 0, mw, mh);
  const zz = Math.min(ZMAX, Math.max(0, levelFor(s * 2 / dpr))), sc = scaleOf(zz), tpt = T / sc, [nx, ny] = M.levels[zz];
  for (const [L, a] of stack()) { 
    mg.globalAlpha = a;
    for (let x = 0; x < nx; x++) for (let y = 0; y < ny; y++) {
      const e = tile(L, zz, x, y, true);
      if (e && e.ok) mg.drawImage(e.img, x * tpt * s, y * tpt * s, tpt * s + .5, tpt * s + .5);
    } 
  }
  mg.globalAlpha = 1;
  const [a0, b0] = toPt(0, 0), [a1, b1] = toPt(W, H);
  mg.strokeStyle = "#e60000"; mg.lineWidth = 1.5;
  mg.strokeRect((a0 - M.x0) * s, (b0 - M.y0) * s, (a1 - a0) * s, (b1 - b0) * s);
  if (marker) { mg.fillStyle = "#e60000"; mg.beginPath(); mg.arc((marker.x - M.x0) * s, (marker.y - M.y0) * s, 3, 0, 7); mg.fill(); }
}
function frame(t) {
  if (anim) anim(t);
  if (dirty) {
    dirty = false; clampView();
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = k * dpr > M.maxScale ? "low" : "high";
    const z = levelFor(k);
    for (const [L, a] of stack()) drawLayer(L, z, a);
    drawOverlay(); drawMini();
    $("#hud").textContent = sceneName(scene) + "  z" + z + "  " + k.toFixed(2) + " px/pt  中心 " + cx.toFixed(1) + ", " + cy.toFixed(1)
      + (hover ? "  游標 " + hover[0].toFixed(1) + ", " + hover[1].toFixed(1) : "");
  }
  requestAnimationFrame(frame);
}

// ---- 互動
const ptrs = new Map(); let down = null, pinch0 = null;
function zoomAt(sx, sy, f) {
  const [px, py] = toPt(sx, sy); k = Math.max(kFit() * 0.5, Math.min(kMax(), k * f));
  cx = px - (sx - W / 2) / k; cy = py - (sy - H / 2) / k; anim = null; dirty = true;
}
cv.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.0015))); }, {passive: false});
cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1) down = {x: e.clientX, y: e.clientY, cx, cy, moved: false};
  if (ptrs.size === 2) { const [p, q] = [...ptrs.values()]; pinch0 = {d: Math.hypot(p[0] - q[0], p[1] - q[1]), k}; down && (down.moved = true); }
  cv.classList.add("drag"); anim = null;
});
cv.addEventListener("pointermove", e => {
  hover = toPt(e.clientX, e.clientY); dirty = true;
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 2 && pinch0) {
    const [p, q] = [...ptrs.values()], d = Math.hypot(p[0] - q[0], p[1] - q[1]);
    zoomAt((p[0] + q[0]) / 2, (p[1] + q[1]) / 2, pinch0.k * d / pinch0.d / k);
  } else if (ptrs.size === 1 && down) {
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) down.moved = true;
    if (down.moved) { cx = down.cx - dx / k; cy = down.cy - dy / k; }
  }
});
function up(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch0 = null;
  if (ptrs.size === 0) { cv.classList.remove("drag"); if (down && !down.moved) clickAt(e.clientX, e.clientY); down = null; }
  else if (ptrs.size === 1) { const [p] = [...ptrs.values()]; down = {x: p[0], y: p[1], cx, cy, moved: true}; }
}
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
cv.addEventListener("dblclick", e => zoomAt(e.clientX, e.clientY, 2));
function clickAt(sx, sy) {
  const [x, y] = toPt(sx, sy), rad = Math.max(6, 14 / k);
  pick = {x, y}; dirty = true;
  const f = $("#showFlags").checked ? nearestFlag(x, y, rad) : null, n = nearest(x, y, rad);
  let h = "座標 <b>" + x.toFixed(1) + ", " + y.toFixed(1) + "</b>";
  if (n) h += "<br>最近: <b>" + (scene === "*" ? escapeHtml(n.code) + "・" : "") + escapeHtml(n.disp) + " " + (n.side || "") + "</b>" + (n.via ? "（" + n.via + "）" : "") + " 距 " + Math.hypot(n.x - x, n.y - y).toFixed(1) + "pt" + (n.note ? "<br>" + escapeHtml(n.note) : "");
  else h += "<br>附近沒有 " + escapeHtml(sceneName(scene)) + " 的點";
  if (f) h += "<br><span class='warn'>異常 " + escapeHtml((f[1] || "") + " " + (f[2] || "")) + "：" + escapeHtml(f[5] || "") + "</span>";
  $("#msg").innerHTML = h;
  setHash({s: scene, v: curView(), x: x.toFixed(1), y: y.toFixed(1), k: k.toFixed(2)});
}
mini.addEventListener("pointerdown", e => {
  const r = mini.getBoundingClientRect(), s = r.width / M.W;
  flyTo(M.x0 + (e.clientX - r.left) / s, M.y0 + (e.clientY - r.top) / s, k, 250);
});
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") { if (e.key === "Enter" && e.target.id === "q") doSearch(); return; }
  const st = 120 / k, i = CODES.indexOf(scene);
  if (e.key === "/") { e.preventDefault(); $("#q").focus(); $("#q").select(); }
  else if (e.key === "[" && i > 0) setScene(CODES[i - 1], true);
  else if (e.key === "]" && i < CODES.length - 1) setScene(CODES[i + 1], true);
  else if (e.key === "+" || e.key === "=") zoomAt(W / 2, H / 2, 1.5);
  else if (e.key === "-") zoomAt(W / 2, H / 2, 1 / 1.5);
  else if (e.key === "0") { cx = M.x0 + M.W / 2; cy = M.y0 + M.H / 2; k = kFit(); dirty = true; }
  else if (e.key === "ArrowLeft") { cx -= st; dirty = true; } else if (e.key === "ArrowRight") { cx += st; dirty = true; }
  else if (e.key === "ArrowUp") { cy -= st; dirty = true; } else if (e.key === "ArrowDown") { cy += st; dirty = true; }
});
$("#go").onclick = doSearch;
document.querySelectorAll("input[name=side]").forEach(r => r.onchange = () => { if ($("#q").value.trim()) doSearch(); });
$("#tog").onclick = () => { $("#panel").classList.toggle("min"); $("#tog").textContent = $("#panel").classList.contains("min") ? "＋" : "－"; };
$("#showPts").onchange = $("#showFlags").onchange = $("#showBase").onchange = $("#showGhost").onchange = () => dirty = true;
document.querySelectorAll("input[name=view]").forEach(r => r.onchange = () => { dirty = true; setHash(Object.assign(Object.fromEntries(lastHash.split("&").filter(Boolean).map(p => p.split("=").map(decodeURIComponent))), {v: curView()})); });

(function init() {
  $("#ttl").textContent = M.pdf + (IX.built ? " 索引 " + IX.built : "");
  const sel = $("#scene");
  sel.innerHTML = "<option value='*'>全部場景（全圖上查）</option>" + IX.scenes.map(s => "<option value='" + s.code + "'>" + escapeHtml(s.code + (s.label ? " " + s.label : "")) + "（" + s.n + "）"
    + (PRESENT[s.code] ? "" : " 未切圖") + "</option>").join("");
  sel.onchange = () => setScene(sel.value, true);
  resize(); k = kFit(); addEventListener("resize", resize);
  const h = Object.fromEntries(location.hash.slice(1).split("&").filter(Boolean).map(p => { const i = p.indexOf("="); return [p.slice(0, i), decodeURIComponent(p.slice(i + 1))]; }));
  if (h.s && (SC[h.s] || h.s === "*")) scene = h.s;
  if (h.v) setView(h.v);
  sel.value = scene;
  $("#views").style.display = scene === "*" || !PRESENT[M.all] ? "none" : "";
  if (h.id) { $("#q").value = h.id; setSide(h.side); doSearch(); }
  else if (h.x && h.y) { const x = +h.x, y = +h.y; marker = {x, y, t: performance.now()}; flyTo(x, y, h.k ? +h.k : M.maxScale * 0.9, 0); }
  addEventListener("hashchange", () => { if (location.hash.slice(1) !== lastHash) location.reload(); });
  if (!IX.scenes.length) $("#msg").innerHTML = "<span class='warn'>沒有場景(index.js 空的), 先跑 DO_SPLIT / DO_INDEX</span>";
  requestAnimationFrame(frame);
})();
</script>
</body>
